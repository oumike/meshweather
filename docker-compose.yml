services:
  meshweather-ingestor:
    image: ghcr.io/oumike/meshweather-ingestor:latest
    pull_policy: always
    container_name: meshweather-ingestor
    env_file:
      - ./meshweather-ingestor/.env
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
            urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    volumes:
      - meshweather_data:/app/data
    restart: unless-stopped

  meshweather-frontend:
    image: ghcr.io/oumike/meshweather-frontend:latest
    pull_policy: always
    container_name: meshweather-frontend
    ports:
      - "${MESHWEATHER_FRONTEND_PORT:-10090}:80"
    depends_on:
      meshweather-ingestor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meshweather_data:
